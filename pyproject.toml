[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "modifystrap"
version = "0.1.0"
description = "Premium desktop manager for Roblox Studio installations and customization profiles"
readme = "README.md"
requires-python = ">=3.10"
authors = [
  { name = "Modifystrap contributors" },
]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
modifystrap = "modifystrap.__main__:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
