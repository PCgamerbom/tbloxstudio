name: Build Modifystrap for Windows

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-tbloxstudio.yml"
      - "modifystrap/**"
      - "src/**"
      - "tests/**"
      - "pyproject.toml"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Modifystrap and build tools
        run: python -m pip install --upgrade pip && python -m pip install ".[dev,build]"

      - name: Run tests
        run: python -m pytest

      - name: Build standalone Windows executable
        run: python -m PyInstaller --noconfirm --clean --windowed --name Modifystrap --paths . --paths src --collect-submodules src.modifystrap modifystrap/__main__.py

      - name: Upload executable
        uses: actions/upload-artifact@v4
        with:
          name: Modifystrap-Windows-x64
          path: dist/Modifystrap.exe
          if-no-files-found: error
          retention-days: 30